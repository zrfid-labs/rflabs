name: update-laws
on:
  schedule:
    - cron: "0 3 * * *"   # ежедневно в 06:00 МСК
  workflow_dispatch: {}    # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать данные СОЗД
        run: python parser/fetch_sozd.py

      - name: Умная разметка бесплатным LLM (без ключей)
        run: python parser/llm_classify.py --max-requests 300 --sleep 4

      - name: Разборы законопроектов из пояснительных записок
        run: python parser/digest.py --max-bills 60 --sleep 4

      - name: Классифицировать (правила + LLM-метки + разборы)
        run: python parser/classify.py

      - name: Закоммитить изменения
        run: |
          git config user.name "laws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/laws_raw.json data/laws.json data/meta.json data/llm_labels.json data/digests.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "данные: автообновление $(date -u +%F)"
            git push
          fi
