name: update-laws
on:
  schedule:
    - cron: "0 3 * * *"   # ежедневно в 06:00 МСК
  workflow_dispatch: {}    # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать данные СОЗД
        run: python parser/fetch_sozd.py

      - name: Умная разметка бесплатным LLM (без ключей)
        run: python parser/llm_classify.py --max-requests 120 --sleep 4

      - name: Разборы законопроектов из пояснительных записок
        run: python parser/digest.py --max-bills 40 --sleep 4

      - name: Классифицировать (правила + LLM-метки + разборы)
        run: python parser/classify.py

      - name: RSS-фид новых анти-законов
        run: python parser/make_feed.py

      - name: Проверка целостности сайта
        run: |
          test -s index.html || (echo "БЕДА: index.html пуст!" && exit 1)
          test -s app.js || (echo "БЕДА: app.js пуст!" && exit 1)
          test -s style.css || (echo "БЕДА: style.css пуст!" && exit 1)
          python -c "import json; json.load(open('data/laws.json')); print('laws.json валиден')"
          python parser/fetch_sozd.py --help > /dev/null && echo "парсер запускается"

      - name: Телеграм-рассылка новых анти-законов
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python parser/tg_digest.py

      - name: Закоммитить изменения
        run: |
          git config user.name "laws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ feed.xml
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "данные: автообновление $(date -u +%F)"
            git push
          fi
